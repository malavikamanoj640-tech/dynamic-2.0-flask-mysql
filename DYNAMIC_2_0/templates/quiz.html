{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">PRACTISE · ASSESS · IMPROVE</span><h1>Quiz Center</h1><p>Attempt a short knowledge check. Results are stored for subject-wise progress analysis.</p></div></div><div class="quiz-card"><div class="mb-3"><label class="form-label">Quiz subject</label><select id="subject" class="form-select"><option>Web Development</option><option>Python</option><option>SQL & DBMS</option><option>Computer Fundamentals</option></select></div><div class="progress mb-4" style="height:7px"><div id="quizProgress" class="progress-bar" style="width:20%"></div></div><div id="qarea"></div><button id="next" class="btn btn-primary mt-3" onclick="nextQ()">Next question <i class="bi bi-arrow-right"></i></button><div id="result" class="result d-none"></div></div>{% endblock %}{% block scripts %}<script>
const questionBank={
'Web Development':[['Which language structures web pages?',['HTML','Python','SQL','C++'],0],['Which CSS property changes text color?',['font','color','paint','text-style'],1],['Which JavaScript keyword declares a block-scoped variable?',['var','let','define','dim'],1],['Which HTML element creates a hyperlink?',['<link>','<a>','<href>','<url>'],1],['Bootstrap is primarily a...',['Database','CSS framework','Operating system','Python library'],1]],
'Python':[['Which symbol starts a Python comment?',['//','#','<!--','*'],1],['Which data type stores key-value pairs?',['list','tuple','dictionary','set'],2],['Which keyword defines a function?',['function','def','fun','method'],1],['What does len() return?',['Memory size','Number of items','Data type','Last index'],1],['Which structure is immutable?',['list','dictionary','set','tuple'],3]],
'SQL & DBMS':[['Which SQL command retrieves data?',['GET','SELECT','OPEN','SHOWALL'],1],['Which key uniquely identifies a row?',['Foreign key','Primary key','Candidate value','Index only'],1],['Which clause filters grouped records?',['WHERE','ORDER BY','HAVING','LIMIT'],2],['Which command modifies existing rows?',['UPDATE','CHANGE','ALTER DATA','MODIFY ROW'],0],['A foreign key is used to...',['Encrypt data','Link related tables','Sort rows','Delete duplicates'],1]],
'Computer Fundamentals':[['Which component executes instructions?',['CPU','Monitor','Keyboard','Printer'],0],['Which is volatile memory?',['ROM','SSD','RAM','DVD'],2],['What does URL stand for?',['Uniform Resource Locator','Universal Record Link','User Routing Language','Unified Resource List'],0],['Which number system uses base 2?',['Decimal','Octal','Hexadecimal','Binary'],3],['Which protocol is commonly used for secure web browsing?',['FTP','HTTPS','SMTP','Telnet'],1]]
};
let subject=document.getElementById('subject'),qs=questionBank[subject.value],qi=0,score=0,answered=false;
subject.addEventListener('change',()=>{qs=questionBank[subject.value];qi=0;score=0;answered=false;document.getElementById('qarea').classList.remove('d-none');document.getElementById('next').classList.remove('d-none');document.getElementById('result').classList.add('d-none');render()});
function render(){let q=qs[qi];document.getElementById('qarea').innerHTML=`<small>QUESTION ${qi+1} OF ${qs.length}</small><h4 class="mt-2">${q[0]}</h4><div class="answers">${q[1].map((a,i)=>`<button type="button" onclick="answer(${i},this)">${a}</button>`).join('')}</div>`;document.getElementById('quizProgress').style.width=((qi+1)/qs.length*100)+'%'}
function answer(i,b){if(answered)return;answered=true;if(i===qs[qi][2]){score++;b.classList.add('correct')}else{b.classList.add('wrong');document.querySelectorAll('.answers button')[qs[qi][2]].classList.add('correct')}}
async function nextQ(){if(!answered)return;if(qi<qs.length-1){qi++;answered=false;render()}else{const sub=subject.value;const res=await fetch('/quiz/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score,total:qs.length,subject:sub})});if(!res.ok){alert('Could not save the quiz result. Please try again.');return}document.getElementById('qarea').classList.add('d-none');document.getElementById('next').classList.add('d-none');let r=document.getElementById('result');r.classList.remove('d-none');r.innerHTML=`<i class="bi bi-trophy"></i><h2>${score}/${qs.length}</h2><p>Your ${sub} result has been saved to Learning Analytics.</p><a class="btn btn-primary" href="/quiz">Try again</a> <a class="btn btn-outline-primary" href="/analytics">View analytics</a>`}}
render();</script>{% endblock %}
